- name: Create users.xml with default profile
  ansible.builtin.copy:
    content: |
      <?xml version="1.0"?>
      <clickhouse>
          <profiles>
              <default>
                  <max_memory_usage>10000000000</max_memory_usage>
                  <use_uncompressed_cache>0</use_uncompressed_cache>
                  <load_balancing>random</load_balancing>
              </default>
          </profiles>
          <users>
              <default>
                  <password></password>
                  <networks>
                      <ip>::/0</ip>
                      <ip>0.0.0.0/0</ip>
                  </networks>
                  <profile>default</profile>
                  <quota>default</quota>
              </default>
          </users>
          <quotas>
              <default>
                  <interval>
                      <duration>3600</duration>
                      <queries>0</queries>
                  </interval>
              </default>
          </quotas>
      </clickhouse>
    dest: /etc/clickhouse-server/users.xml
    mode: '0644'
    owner: clickhouse
    group: clickhouse